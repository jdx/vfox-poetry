name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install: false
      - name: Link plugin
        run: mise plugins link poetry "$GITHUB_WORKSPACE"
      - name: Validate shell-safe installer paths
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          lua5.1 test/post_install.lua
      - name: Install poetry with a precompiled Python
        env:
          MISE_PYTHON_COMPILE: 0
        run: |
          mise use -g python@3.13
          mise use -g poetry@2.1.3
      - name: Venv python is a symlink
        if: runner.os != 'Windows'
        run: |
          py="$(mise where poetry)/venv/bin/python3"
          ls -l "$py"
          test -L "$py"
      - name: Poetry runs
        run: mise exec -- poetry --version
